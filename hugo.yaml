baseURL: "https://keebs.fehmer.info/"
canonifyURLs: false
locale: "en-us"
title: "keebs/fehmer.info"
theme: "hugo-theme-crt"
pagination:
  pagerSize: 9999

module:
  mounts:
    - source: static
      target: assets

caches:
  images:
    dir: :cacheDir/images

params:
  # basepath for favicon
  favicon: "https://fehmer.info"
  links:
    - href: "mailto:keebs//at//fehmer//dot/info"
      title: "send a mail"
      icon: email
    - href: "https://github.com/fehmer"
      title: "github profile"
      icon: github
    - href: "https://www.npmjs.com/~fehmer"
      title: "npm profile"
      icon: npm
    - href: "https://fehmer.info"
      title: "my homepage"
      icon: homepage
    - href: "https://www.xing.com/profile/Christian_Fehmer"
      title: "xing profile"
      icon: xing
  style:
    color_text: "#a0a0a0"
    color_background: "#0e0e0e"
    color_link: "#eeff00"
    color_link_visited: "#7B8040"
    color_accent: "#eeff00"
    color_logo: "#1d96a5"
    color_copyright: "#7B8040"
    color_hugo: "#A2AA2B"
    color_theme: "#C8D515"
    color_monochrome: "false"
    color_crt_effect: "false"
